<canvas height="1024" id="confetti-canvas" width="1280"></canvas>
<script>
        // Particle System for Party Popper
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height * 0.7;
                this.size = Math.random() * 8 + 4;
                this.speedX = (Math.random() - 0.5) * 20;
                this.speedY = -Math.random() * 20 - 5;
                this.gravity = 0.5;
                this.color = `hsl(${Math.random() * 60 + 260}, 70%, 70%)`; // Lavender/Gold tones
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 10;
            }
            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.y > canvas.height) particles.splice(i, 1);
            });
            if (particles.length > 0) requestAnimationFrame(animateConfetti);
        }

        function createConfetti() {
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
            animateConfetti();
        }

        // Interaction Logic
        const blowBtn = document.getElementById('blow-candles-btn');
        const visitBtn = document.getElementById('visit-moments-btn');
        const message = document.getElementById('message-container');
        const cake = document.getElementById('cake-wrapper');
        const toast = document.getElementById('toast-announcement');

        blowBtn.addEventListener('click', () => {
            // Trigger effects
            createConfetti();
            
            // UI State Changes
            blowBtn.classList.add('hidden');
            message.classList.remove('hidden');
            message.classList.add('fade-in');
            
            setTimeout(() => {
                visitBtn.classList.remove('hidden');
                visitBtn.classList.add('fade-in');
                
                // Show toast
                toast.classList.remove('opacity-0', 'translate-y-10');
                toast.classList.add('opacity-100', 'translate-y-0');
            }, 800);

            // Change Cake State (Simulate blowing out via filter change)
            cake.style.filter = 'brightness(1.1) saturate(1.1)';
            cake.style.transition = 'all 2s ease';

            // Auto-navigate to the next page (Memories) after 3 seconds
            setTimeout(() => {
                window.location.href = 'memories.html';
            }, 3000);
        });

        // Parallax Effect
        window.addEventListener('mousemove', (e) => {
            const layers = document.querySelectorAll('.parallax-layer');
            const x = (e.clientX - window.innerWidth / 2) / 50;
            const y = (e.clientY - window.innerHeight / 2) / 50;
            
            layers.forEach((layer, index) => {
                const speed = (index + 1) * 0.5;
                layer.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
